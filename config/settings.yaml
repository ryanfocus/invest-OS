# OS 策略設定
#
# ⚠️ 這裡的每一個 key 都必須有程式讀取（結構性檢查，見 settings.consumed_keys），
#    測試會比對兩邊一致。加了沒人讀的設定會讓測試失敗——這是刻意的，
#    孤兒設定會讓人以為改了有效，其實沒有。
#
# 帳號密碼不在這裡，在 .env（不進版控）。

discord:
  # Discord 訊號發報。關閉時完全不發出 HTTP 請求。
  enabled: true

quote:
  # 取開盤價的重試。08:50 執行時報價偶爾晚幾十秒才齊，重試就是為了等它。
  #
  # ⚠️ 間隔比次數重要：「未就緒」的時間尺度是秒到分，不是毫秒。
  #    把間隔設成 0 等於取消整個機制——三次會在毫秒內燒完。
  retry_attempts: 3
  retry_interval_seconds: 60

capital:
  # 群益連線環境。production 時**完全不呼叫** SKCenterLib_SetAuthority
  # （不呼叫就是正式環境，那是它的預設值）。
  #
  # ⚠️ **test 不是一般帳戶的模擬環境，不要把它當成安全網。**
  #    官方文件對 SetAuthority 的說明是「(SGX 專線only)…一般客戶可忽略此部分」，
  #    而 SGX 專線要另向營業員申請。範例程式雖然把 flag 2 標成「測試環境」，
  #    但那是 SGX 專線的測試環境。設成 test 很可能只是無效——
  #    而「以為切到測試環境所以很安全」比根本不切更危險。
  #
  #    要驗證倉別參數，目前唯一可靠的方法是**在正式環境用 1 口微台實打**
  #    （微台每點 10 元，是所有台指商品裡最小的單位）。
  environment: production

order:
  # 自動下單總開關。
  #
  # ⚠️ **關閉時程式完全不呼叫下單 API**，只算訊號、發 Discord。
  #    測試 test_shipped_config_has_auto_ordering_switched_off 會擋住
  #    「不小心把開著的設定 commit 上來」。
  #
  # 🚦 **絕不允許在沒有實機測過 API 下單的情況下開啟。**
  #    假 broker 的測試只證明「程式照我想的方式運作」，
  #    不證明「群益會照我想的方式回應」。
  #
  #    進度（2026-08-21 實機里程碑完成）：
  #      ✅ tools/verify_order_path.py 全綠（零風險，2026-08-16／17）
  #      ✅ SKReplyLib_ConnectByID 與 OnNewData 實機驗證（2026-08-17）
  #      ✅ nOpen 與期交所一致（三來源，2026-08-18／19）
  #      ✅ **SendFutureOrderCLR 實機驗證**（2026-08-21，1 口微台完整來回）
  #         進場 sNewClose=0 未被拒、出場 sNewClose=2 正確平倉
  #      ⚠️ **但只驗到「同方向持倉」那一半**——使用者當時持有多單、OS 也做多，
  #         全程沒有跨越零。「已有反向部位時」的行為仍未驗證，見
  #         .scratch/os-strategy/issues/04-entry-order-and-position-state.md
  #
  #    臨時開啟做上述驗證是預期用法，但**驗完要改回 false，且不可 commit 開啟的狀態**。
  auto_enabled: false

  # 交易標的：TX00AM=大台、MTX00AM=小台、TM0000AM=微台。
  # 程式不檢查槓桿或保證金，口數多少就送多少。
  #
  # ⚠️ 口數上限 10——期交所限制每筆市價委託口數（一般交易時段 10 口），
  #    我們送的是市價 IOC，超過會被退單而且訊息看不出原因。
  #
  # 📌 **目前是微台，因為還在實機驗證階段**（ticket 04 里程碑 1、ticket 06 里程碑 2）。
  #    驗證要送真單，用最小的那個商品：
  #
  #      大台 TX 每點 200 元 ｜ 小台 MTX 每點 50 元 ｜ **微台 TMF 每點 10 元**
  #
  #    驗完之後才依實際資金規模決定要用哪一個。**不要在驗證做完前改大。**
  product: TM0000AM
  lots: 1

  # 送出委託後等成交回報的秒數。
  #
  # ⚠️ 逾時**不代表沒成交**——單可能已經成交、只是回報慢了。這時程式會把
  #    狀態記為「不確定」並要求人工確認，下午不會自動平倉。
  #    所以設太短的代價是「每天都要人介入」，不是「比較安全」。
  fill_timeout_seconds: 10

calendar:
  # holidays 套件只知道國定假日，不知道這兩種台灣特有的情況。
  # 格式為 YYYY-MM-DD（yaml 會自動解析成日期），兩邊同時列出時**休市優先**。
  extra_closures: []   # 臨時休市：颱風假等
  extra_openings: []   # 臨時開市：補班日等
