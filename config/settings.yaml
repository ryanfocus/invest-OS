# OS 策略設定
#
# 這份檔案是**你要填的**。帳號密碼不在這裡，在 `.env`（不進版控）。
# 每一項都寫了「設錯會怎樣」——那通常比「這是什麼」重要。
#
# 改完之後不必重開任何東西：程式每次執行都會重新讀取。

discord:
  # 訊號通知。關閉時完全不發出任何 HTTP 請求。
  #
  # ⚠️ 關掉之後，程式出事你不會收到任何通知——它仍然會照常下單。
  enabled: true

order:
  # 自動下單總開關。
  #
  #   false → 只算訊號、發 Discord，**完全不呼叫下單 API**
  #   true  → 依訊號送出真實委託
  #
  # ⚠️ **開著的狀態不要 commit。** 臨時打開做驗證是預期用法，但驗完要改回
  #    `false`——有一條測試會在你忘記時變紅。
  auto_enabled: false

  # 交易標的與口數。程式不檢查槓桿或保證金，你填多少就送多少。
  #
  #   TX00AM    大台 TX   每點 200 元
  #   MTX00AM   小台 MTX  每點 50 元
  #   TM0000AM  微台 TMF  每點 10 元
  #
  # ⚠️ 口數上限 10。期交所限制每筆市價委託的口數，超過會被退單，
  #    而退單訊息看不出是這個原因。
  product: TM0000AM
  lots: 1

  # 進場的時間界線。**一個時間管兩件事**（2026-11-23 起）：
  #
  #   1. 08:45:05 拿不到開盤價時，重試到這個時間就放棄（發「今日無訊號」）
  #   2. 過了這個時間就**不下單**（訊號與觀測記錄照常產生）
  #
  # 第 2 件是為了停電或 Windows 重開之後的情況：排程會在電腦回來的那一刻補跑，
  # 那時開盤價早就有了、一讀就到，若沒有這道界線就會照樣用市價把單送出去。
  # 最糟的是它拖到 13:40 之後才跑——那時出場那班已經結束了，
  # 開出來的部位**沒有東西會去平它**。
  #
  # 正常日子開盤價 08:45:00 就到，08:45:06 左右就下單，碰不到這個時間。
  #
  # 寫 `none` 代表**不設限**，什麼時候跑都下單；這時開盤價最多只試一分鐘。
  #
  # ⚠️ **要關掉就要真的打出 `none` 這個字。** 留白是錯誤，不是關閉——
  #    做成「留白＝關掉」的話，任何一次手滑刪掉值都會靜靜地把它關掉。
  #
  # ⚠️ 有時間的話**一定要加引號或前導零**。YAML 把 `8:50` 當成數字 530，
  #    `"08:50"` 才是時間。寫錯的話程式會在啟動時擋下來並告訴你原因。
  entry_cutoff: "08:50"
