# OS 策略設定
#
# 這份檔案是**你要填的**。帳號密碼不在這裡，在 `.env`（不進版控）。
# 每一項都寫了「設錯會怎樣」——那通常比「這是什麼」重要。
#
# 改完之後不必重開任何東西：程式每次執行都會重新讀取。

discord:
  # 訊號通知。關閉時完全不發出任何 HTTP 請求。
  #
  # ⚠️ 關掉之後，程式出事你不會收到任何通知——它仍然會照常下單。
  enabled: true

quote:
  # 08:50 取開盤價時，報價偶爾晚幾十秒才齊，重試就是為了等它。
  # 實際上幾乎每天都會用到第二次。
  #
  # ⚠️ 間隔設成 0 等於取消整個機制——三次會在毫秒內燒完，
  #    然後那天變成「今日無訊號」。間隔比次數重要。
  retry_attempts: 3
  retry_interval_seconds: 60

capital:
  # 群益的連線環境。
  #
  # ⚠️ **`test` 不是模擬環境，不要把它當成安全網。**
  #    那個選項是給 SGX 專線用的（要另向營業員申請），一般帳戶設了很可能無效。
  #    而「以為切到測試環境所以很安全」比根本不切更危險。
  #
  #    要試下單就用 1 口微台在正式環境打——每點 10 元，是最小的單位。
  environment: production

order:
  # 自動下單總開關。
  #
  #   false → 只算訊號、發 Discord，**完全不呼叫下單 API**
  #   true  → 依訊號送出真實委託
  #
  # ⚠️ **開著的狀態不要 commit。** 臨時打開做驗證是預期用法，但驗完要改回
  #    `false`——有一條測試會在你忘記時變紅。
  auto_enabled: false

  # 交易標的與口數。程式不檢查槓桿或保證金，你填多少就送多少。
  #
  #   TX00AM    大台 TX   每點 200 元
  #   MTX00AM   小台 MTX  每點 50 元
  #   TM0000AM  微台 TMF  每點 10 元
  #
  # ⚠️ 口數上限 10。期交所限制每筆市價委託的口數，超過會被退單，
  #    而退單訊息看不出是這個原因。
  product: TM0000AM
  lots: 2

  # 送出委託後等成交回報的秒數。
  #
  # ⚠️ 逾時**不代表沒成交**——單可能已經成交、只是回報慢了。這時程式會把
  #    狀態記成「不確定」，下午不會自動平倉，改叫你去確認帳戶。
  #    所以設太短的代價是「每天都要你介入」，不是「比較安全」。
  fill_timeout_seconds: 10

  # 進場的時間界線。過了它就**不下單**（訊號與觀測記錄照常產生）。
  #
  # 這是為了停電或 Windows 重開之後的情況：排程會在電腦回來的那一刻補跑，
  # 而程式本身沒有時鐘，會照樣用市價把單送出去。最糟的是它拖到 13:40 之後
  # 才跑——那時出場那班已經結束了，開出來的部位**沒有東西會去平它**。
  #
  # ⚠️ **一定要加引號或前導零。** YAML 把 `9:00` 當成數字 540，
  #    `"09:00"` 才是時間。差一個零就是完全不同的東西。
  #    寫錯的話程式會在啟動時擋下來並告訴你原因，但寫對比較省事。
  entry_cutoff: "09:00"

calendar:
  # 台灣特有的兩種情況，`holidays` 套件不知道。
  # 格式 YYYY-MM-DD，兩邊同時列出時**休市優先**。
  extra_closures: []   # 臨時休市：颱風假等
  extra_openings: []   # 臨時開市：補班日等
