# OS 策略設定
#
# ⚠️ 這裡的每一個 key 都必須有程式讀取（結構性檢查，見 settings.consumed_keys），
#    測試會比對兩邊一致。加了沒人讀的設定會讓測試失敗——這是刻意的，
#    孤兒設定會讓人以為改了有效，其實沒有。
#
# 帳號密碼不在這裡，在 .env（不進版控）。

discord:
  # Discord 訊號發報。關閉時完全不發出 HTTP 請求。
  enabled: true

quote:
  # 取開盤價的重試。08:50 執行時報價偶爾晚幾十秒才齊，重試就是為了等它。
  #
  # ⚠️ 間隔比次數重要：「未就緒」的時間尺度是秒到分，不是毫秒。
  #    把間隔設成 0 等於取消整個機制——三次會在毫秒內燒完。
  retry_attempts: 3
  retry_interval_seconds: 60

calendar:
  # holidays 套件只知道國定假日，不知道這兩種台灣特有的情況。
  # 格式為 YYYY-MM-DD（yaml 會自動解析成日期），兩邊同時列出時**休市優先**。
  extra_closures: []   # 臨時休市：颱風假等
  extra_openings: []   # 臨時開市：補班日等
